<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAB Faculty Committee Memberships</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <header class="text-center py-4">
            <h1><i class="fas fa-graduation-cap"></i> UAB Faculty Committee Memberships</h1>
            <p class="lead">Explore faculty mentoring relationships and graduate committee memberships at UAB</p>
        </header>

        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search faculty names, research areas, or students...">
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-filter"></i></span>
                    <input type="text" id="researchFilter" class="form-control" list="researchAreasList" placeholder="Filter by research area...">
                    <datalist id="researchAreasList"></datalist>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="d-flex gap-2">
                    <button id="clearFilters" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-times"></i> Clear Filters
                    </button>
                    <button id="downloadCSV" class="btn btn-success btn-sm">
                        <i class="fas fa-download"></i> Download CSV
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <div class="d-flex align-items-center justify-content-end gap-3">
                    <small class="text-muted">
                        Showing <span id="showingStart">1</span>-<span id="showingEnd">20</span> of <span id="totalResults">0</span> faculty
                    </small>
                    <div class="btn-group btn-group-sm">
                        <button id="prevPage" class="btn btn-outline-primary" disabled>
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span id="pageInfo" class="btn btn-outline-secondary disabled">Page 1</span>
                        <button id="nextPage" class="btn btn-outline-primary">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Faculty Name</th>
                        <th>Research Areas</th>
                        <th>Students</th>
                        <th>Profile</th>
                    </tr>
                </thead>
                <tbody id="facultyTableBody">
                    <tr>
                        <td colspan="4" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <small class="text-muted">
                    <i class="fas fa-info-circle"></i> 
                    Data from UAB Scholars database. Faculty profile links open in new tab.
                </small>
            </div>
            <div class="col-md-6 text-end">
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary" onclick="changePageSize(10)">10</button>
                    <button class="btn btn-outline-secondary active" onclick="changePageSize(20)">20</button>
                    <button class="btn btn-outline-secondary" onclick="changePageSize(50)">50</button>
                    <button class="btn btn-outline-secondary" onclick="changePageSize(100)">100</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
